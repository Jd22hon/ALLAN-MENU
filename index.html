        header { text-align: center; padding: 30px 20px; background: #1a1a1a; border-bottom: 3px solid #ff5722; }
        h1.neon-title { font-size: 3.5rem; color: #ff5722; margin: 0; font-weight: 900; letter-spacing: 2px; }
        p.subtitle { font-size: 1.1rem; color: #aaa; margin-top: 5px; text-transform: uppercase; letter-spacing: 3px; }
        .container { max-width: 800px; margin: 20px auto; padding: 0 15px; padding-bottom: 100px; }
        .category-title { color: #ff5722; border-bottom: 2px solid #333; padding-bottom: 8px; margin-top: 35px; font-size: 1.4rem; text-transform: uppercase; }
        .product-card { display: flex; justify-content: space-between; align-items: center; background: #1e1e1e; padding: 15px; margin-bottom: 12px; border-radius: 8px; border-left: 4px solid #ff5722; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
        .product-info h4 { margin: 0 0 5px 0; color: #fff; font-size: 1.1rem; }
        .product-info p { margin: 0; font-size: 0.85rem; color: #aaa; }
        .product-price { font-weight: bold; color: #ff5722; font-size: 1.2rem; margin-right: 15px; }
        .btn-add { background: #ff5722; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-add:disabled { background: #555; cursor: not-allowed; }
        
        #carritoFlotante { position: fixed; bottom: 20px; right: 20px; background: #ff5722; color: white; padding: 14px 22px; border-radius: 30px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(255,87,34,0.4); z-index: 100; font-size: 1.05rem; }
        
        #modalPedido { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: #1a1a1a; width: 90%; max-width: 480px; padding: 22px; border-radius: 12px; border: 1px solid #444; color: #fff; max-height: 90vh; overflow-y: auto; }
    </style>
</head>

                <button onclick="cerrarAdmin()" style="background: #d32f2f; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold;">Cerrar</button>
            </div>

            </div>
            <div id="adminSeccionPedidos" style="display: none;">

                    <input type="text" id="facRuc" placeholder="RUC / Cédula" style="width: 100%; padding: 8px; margin-bottom: 8px; background: #333; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box;">

                <button onclick="cerrarCheckout()" style="flex: 1; background: #444; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer;">Cerrar</button>

            // MENÚ DE NIÑOS
            { id: 49, categoria: "MENÚ DE NIÑOS", nombre: "Nuggets de pollo", desc: "Pollo apanado con papas fritas", precio: 5.99, disponible: true },
            { id: 50, categoria: "MENÚ DE NIÑOS", nombre: "Papas fritas con chorizo", desc: "Chorizo a la parrilla con papas", precio: 5.99, disponible: true },

            // BEBIDAS & BAR
            { id: 51, categoria: "BEBIDAS", nombre: "Gaseosa", desc: "Bebida personal", precio: 1.44, disponible: true },
            { id: 52, categoria: "BEBIDAS", nombre: "Limonada Imperial", desc: "Refrescante limonada de la casa", precio: 3.45, disponible: true },
            { id: 53, categoria: "BEBIDAS", nombre: "Jarra de jugo de naranja", desc: "Natural y recién exprimido", precio: 8.05, disponible: true },
            { id: 54, categoria: "BEBIDAS", nombre: "Mojito", desc: "Cóctel tradicional de barra", precio: 7.99, disponible: true },
            { id: 55, categoria: "BEBIDAS", nombre: "Piña Colada", desc: "Cóctel tropical", precio: 7.99, disponible: true }
        ];

        let productos = JSON.parse(localStorage.getItem('fogon_productos')) || menuOriginal;
        let carrito = [];
        let historialPedidos = JSON.parse(localStorage.getItem('fogon_pedidos')) || [];

        function renderizarMenu() {
            const container = document.getElementById('menuContainer');
            container.innerHTML = "";
            const categorias = [...new Set(productos.map(p => p.categoria))];

            categorias.forEach(cat => {
                const tituloCat = document.createElement('h3');
                tituloCat.className = 'category-title';
                tituloCat.innerText = cat;
                container.appendChild(tituloCat);

                const prodsCat = productos.filter(p => p.categoria === cat);
                prodsCat.forEach(p => {
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    card.innerHTML = `
                        <div class="product-info">
                            <h4>${p.nombre}</h4>
                            <p>${p.desc}</p>
                        </div>
                        <div style="display: flex; align-items: center;">
                            <span class="product-price">$${p.precio.toFixed(2)}</span>
                            <button class="btn-add" ${!p.disponible ? 'disabled' : ''} onclick="agregarCarrito(${p.id})">
                                ${p.disponible ? 'Agregar' : 'AGOTADO'}
                            </button>
                        </div>
                    `;
                    container.appendChild(card);
                });
            });
            actualizarCarritoUI();
        }

        function agregarCarrito(id) {
            const prod = productos.find(p => p.id === id);
            if (prod && prod.disponible) {
                carrito.push(prod);
                actualizarCarritoUI();
            }
        }

        function actualizarCarritoUI() {
            const total = carrito.reduce((sum, item) => sum + item.precio, 0);
            document.getElementById('cartCount').innerText = carrito.length;
            document.getElementById('cartTotal').innerText = total.toFixed(2);
        }

        function abrirCheckout() {
            if (carrito.length === 0) {
                alert("Tu carrito está vacío.");
                return;
            }
            const resumen = document.getElementById('resumenCarrito');
            resumen.innerHTML = carrito.map(item => `<div>• <strong>${item.nombre}</strong> - $${item.precio.toFixed(2)}</div>`).join('');
            document.getElementById('modalPedido').style.display = 'flex';
        }

        function cerrarCheckout() {
            document.getElementById('modalPedido').style.display = 'none';
        }

        function toggleFacturaFields() {
            const check = document.getElementById('requiereFactura');
            document.getElementById('camposFactura').style.display = check.checked ? 'block' : 'none';
        }

        function enviarWhatsApp() {
            const requiereFac = document.getElementById('requiereFactura').checked;
            let detalleFac = "";
            let datosFacObj = null;
            
            if (requiereFac) {
                const nombre = document.getElementById('facNombre').value;
                const ruc = document.getElementById('facRuc').value;
                const dir = document.getElementById('facDireccion').value;
                const correo = document.getElementById('facCorreo').value;

                if (!nombre || !ruc) {
                    alert("Por favor completa Nombre y RUC/Cédula para la factura.");
                    return;
                }
                datosFacObj = { nombre, ruc, dir, correo };
                detalleFac = `\n\n🧾 *DATOS DE FACTURACIÓN:*\n• Razón Social: ${nombre}\n• RUC/Cédula: ${ruc}\n• Dirección: ${dir}\n• Correo: ${correo}`;
            }

            const total = carrito.reduce((sum, item) => sum + item.precio, 0);
            let textoItems = carrito.map(i => `• ${i.nombre} ($${i.precio.toFixed(2)})`).join('\n');
            let mensaje = `🔥 *NUEVO PEDIDO - FOGON*\n\n🛒 *DETALLE:*\n${textoItems}\n\n💰 *TOTAL:* $${total.toFixed(2)}${detalleFac}`;

            historialPedidos.unshift({
                fecha: new Date().toLocaleString(),
                detalle: carrito.map(i => i.nombre).join(', '),
                factura: datosFacObj,
                total: total.toFixed(2)
            });
            localStorage.setItem('fogon_pedidos', JSON.stringify(historialPedidos));

            const url = `https://wa.me/593992191545?text=${encodeURIComponent(mensaje)}`;
            window.open(url, '_blank');
            
            carrito = [];
            cerrarCheckout();
            renderizarMenu();
        }

        const CLAVE_MODERADOR = "1234";

        function accederAdmin() {
            const pass = prompt("Ingrese la clave de moderador:");
            if (pass === CLAVE_MODERADOR) {
                document.getElementById('panelAdmin').style.display = 'block';
                renderizarAdmin();
            } else if (pass !== null) {
                alert("Clave incorrecta.");
            }
        }

        function cerrarAdmin() {
            document.getElementById('panelAdmin').style.display = 'none';
        }

        function verPestanaAdmin(pestana) {
            document.getElementById('adminSeccionProductos').style.display = (pestana === 'productos') ? 'block' : 'none';
            document.getElementById('adminSeccionPedidos').style.display = (pestana === 'pedidos') ? 'block' : 'none';
        }

        function toggleDisponibleAdmin(id) {
            const p = productos.find(item => item.id === id);
            if (p) {
                p.disponible = !p.disponible;
                localStorage.setItem('fogon_productos', JSON.stringify(productos));
                renderizarAdmin();
                renderizarMenu();
            }
        }

        function cambiarPrecioAdmin(id, nuevoPrecio) {
            const p = productos.find(item => item.id === id);
            if (p && !isNaN(nuevoPrecio)) {
                p.precio = parseFloat(nuevoPrecio);
                localStorage.setItem('fogon_productos', JSON.stringify(productos));
                renderizarMenu();
            }
        }

        function renderizarAdmin() {
            const contenedor = document.getElementById('listaAdminProductos');
            contenedor.innerHTML = productos.map(p => `
                <div style="display: flex; justify-content: space-between; align-items: center; background: #222; padding: 10px; margin-bottom: 8px; border-radius: 6px;">
                    <div>
                        <strong style="font-size: 0.95rem;">${p.nombre}</strong><br>
                        <small>$</small>
                        <input type="number" step="0.5" value="${p.precio.toFixed(2)}" onchange="cambiarPrecioAdmin(${p.id}, this.value)" style="width: 75px; background: #333; color: #fff; border: 1px solid #555; padding: 3px; border-radius: 4px;">
                    </div>
                    <button onclick="toggleDisponibleAdmin(${p.id})" style="background: ${p.disponible ? '#2e7d32' : '#c62828'}; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold;">
                        ${p.disponible ? '🟢 DISPONIBLE' : '🔴 AGOTADO'}
                    </button>
                </div>
            `).join('');

            document.getElementById('countPedidos').innerText = historialPedidos.length;
            const contenedorPedidos = document.getElementById('listaAdminPedidos');
            if (historialPedidos.length === 0) {
                contenedorPedidos.innerHTML = '<p style="color: #888;">No hay pedidos registrados todavía.</p>';
            } else {
                contenedorPedidos.innerHTML = historialPedidos.map(ped => `
                    <div style="background: #222; padding: 12px; margin-bottom: 8px; border-radius: 6px; border-left: 4px solid #ff5722;">
                        <small style="color: #aaa;">${ped.fecha}</small>
                        <p style="margin: 5px 0;"><strong>Platos:</strong> ${ped.detalle}</p>
                        ${ped.factura ? `<p style="margin: 3px 0; color: #4caf50; font-size: 0.85rem;">🧾 Factura: ${ped.factura.nombre} (RUC:${ped.factura.ruc})</p>` : '<p style="margin: 3px 0; color: #888; font-size: 0.85rem;">🧾 Sin Factura</p>'}
                        <p style="margin: 0; color: #ff5722; font-weight: bold;">Total: $${ped.total}</p>
                    </div>
                `).join('');
            }
        }

        function limpiarPedidos() {
            if (confirm("¿Borrar el historial de pedidos?")) {
                historialPedidos = [];
                localStorage.removeItem('fogon_pedidos');
                renderizarAdmin();
            }
        }

        renderizarMenu();
    </script>
</body>
</html>
