    <style>
        :root {
            --orange-fire: #ff5500;
            --orange-glow: rgba(255, 85, 0, 0.85);
            --green-fogon: #0d3b2e;
            --green-accent: #1e6b52;
            --gold-accent: #e6a100;
            --cream-bg: #111111;
            --card-bg: #1c1c1c;
            --text-light: #ffffff;
            --text-gray: #b0b0b0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        html { scroll-behavior: smooth; }
        body { background-color: var(--cream-bg); color: var(--text-light); padding-bottom: 90px; }

        /* PORTADA A PANTALLA COMPLETA CON TU FOTO REAL */
        .hero {
            position: relative;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            overflow: hidden;
            background: url('https://i.postimg.cc/3wwvg4kM/fondo-jpg.png') center/cover no-repeat;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.55);
            z-index: 1;
        }

        .hero-content {
            position: relative;
            z-index: 2;
        }

        .neon-title-black {
            font-size: 5.5rem;
            font-weight: 900;
            letter-spacing: 8px;
            color: #050505;
            text-transform: uppercase;
            text-shadow: 
                0 0 10px #ff5500,
                0 0 25px #ff5500,
                0 0 50px rgba(255, 85, 0, 0.8),
                0 0 80px rgba(255, 85, 0, 0.5);
            margin-bottom: 5px;
        }

        .hero-subtitle {
            font-size: 1.2rem;
            color: #fff;
            font-weight: bold;
            margin-bottom: 30px;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px #000;
        }

        .btn-hero {
            padding: 16px 32px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1.1rem;
            text-decoration: none;
            display: inline-block;
            margin: 8px;
            border: none;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-hero:hover { transform: scale(1.05); }
        .btn-primary { background: var(--orange-fire); color: white; box-shadow: 0 4px 20px var(--orange-glow); }
        .btn-outline { background: rgba(0,0,0,0.7); color: white; border: 2px solid var(--orange-fire); }

        /* CONTENEDOR GENERAL DEL MENÚ */
        .container { max-width: 900px; margin: 0 auto; padding: 20px 15px; }
        
        #menu-wrapper {
            display: none;
            padding-top: 30px;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* PESTAÑAS DE NAVEGACIÓN */
        .categories-nav {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 30px;
            position: sticky;
            top: 10px;
            z-index: 100;
            background: rgba(17, 17, 17, 0.95);
            padding: 12px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid #333;
        }

        .cat-tab {
            background: #222;
            color: #ccc;
            border: 1px solid #333;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .cat-tab.active, .cat-tab:hover {
            background: var(--green-accent);
            color: white;
            border-color: var(--orange-fire);
            box-shadow: 0 0 10px rgba(30, 107, 82, 0.5);
        }

        .category-title {
            color: var(--gold-accent);
            font-size: 1.6rem;
            text-transform: uppercase;
            border-bottom: 2px solid var(--green-accent);
            padding-bottom: 8px;
            margin: 30px 0 15px;
            letter-spacing: 2px;
        }

        /* TARJETAS DE PLATOS */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
        }

        .menu-card {
            background: var(--card-bg);
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, border-color 0.2s;
        }
        .menu-card:hover { border-color: var(--orange-fire); transform: translateY(-3px); }

        .menu-card.sold-out { opacity: 0.5; background: #151515; }

        .item-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
        .item-name { font-size: 1.1rem; font-weight: bold; color: #fff; }
        .item-price { font-size: 1.1rem; font-weight: bold; color: var(--gold-accent); }
        .item-desc { font-size: 0.85rem; color: var(--text-gray); margin-bottom: 15px; line-height: 1.4; }

        .badge-sold { background: #c0392b; color: white; font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; font-weight: bold; margin-left: 5px; }

        .btn-add {
            background: var(--green-accent);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        .btn-add:hover { background: var(--orange-fire); }
        .btn-add:disabled { background: #444; cursor: not-allowed; }

        /* CARRITO FLOTANTE */
        .cart-bar {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(20, 20, 20, 0.95);
            border-top: 2px solid var(--orange-fire);
            padding: 15px 25px;
            display: none; justify-content: space-between; align-items: center;
            z-index: 1000; backdrop-filter: blur(10px);
        }
        .btn-whatsapp { background: #25d366; color: white; border: none; padding: 12px 24px; border-radius: 25px; font-weight: bold; cursor: pointer; }

        /* VENTANAS MODALES */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 2000; justify-content: center; align-items: center; padding: 15px;
        }
        .modal-box {
            background: #1e1e1e; color: white; border-radius: 14px; padding: 25px; width: 100%; max-width: 450px;
            border: 1px solid #333;
        }
        .modal-box input, .modal-box select, .modal-box textarea {
            width: 100%; padding: 10px; margin: 8px 0 15px; background: #2a2a2a; border: 1px solid #444; color: white; border-radius: 8px;
        }
        .btn-close { background: #444; color: white; border: none; padding: 10px; width: 100%; border-radius: 8px; cursor: pointer; margin-top: 5px; }
    </style>
</head>

                entradas: 'Entradas',
                especiales: 'Especiales del Chef',
                cortes: 'Cortes & Res Premium',
                fuertes: 'Platos Fuertes',
                mariscos: 'Mariscos',
                ninos: 'Menú de Niños',
                bebidas: 'Bebidas & Bar'
            };

            categoriasAMostrar.forEach(cat => {
                const items = dbMenu.filter(i => i.cat === cat);
                if (items.length === 0) return;

                let html = `<h2 class="category-title">${nombresCat[cat]}</h2><div class="menu-grid">`;
                
                items.forEach(item => {
                    html += `
                        <div class="menu-card ${item.agotado ? 'sold-out' : ''}">
                            <div>
                                <div class="item-header">
                                    <span class="item-name">${item.name} ${item.agotado ? '<span class="badge-sold">AGOTADO</span>' : ''}</span>
                                    <span class="item-price">$${item.price.toFixed(2)}</span>
                                </div>
                                <p class="item-desc">${item.desc}</p>
                            </div>
                            <button class="btn-add" ${item.agotado ? 'disabled' : ''} onclick="pedirItem(${item.id})">
                                ${item.agotado ? 'Agotado' : '+ Agregar'}
                            </button>
                        </div>
                    `;
                });

                html += `</div>`;
                container.innerHTML += html;
            });
        }

        function pedirItem(id) {
            const item = dbMenu.find(i => i.id === id);
            if (!item || item.agotado) return;

            itemTemporal = { ...item, side: '', note: '' };

            if (item.sides) {
                document.getElementById('mod-title').innerText = item.name;
                document.getElementById('mod-desc').innerText = item.desc;
                document.getElementById('side-select-group').style.display = 'block';
                document.getElementById('modal-options').style.display = 'flex';
            } else {
                document.getElementById('mod-title').innerText = item.name;
                document.getElementById('mod-desc').innerText = item.desc;
                document.getElementById('side-select-group').style.display = 'none';
                document.getElementById('modal-options').style.display = 'flex';
            }
        }

        function agregarAlCarritoConfirmado() {
            if (itemTemporal.sides) {
                itemTemporal.side = document.getElementById('mod-side').value;
            }
            itemTemporal.note = document.getElementById('mod-note').value.trim();

            carrito.push(itemTemporal);
            cerrarModal('modal-options');
            document.getElementById('mod-note').value = '';
            actualizarBarraCarrito();
        }

        function actualizarBarraCarrito() {
            const bar = document.getElementById('cart-bar');
            if (carrito.length > 0) {
                bar.style.display = 'flex';
                document.getElementById('cart-count').innerText = carrito.length;
                const total = carrito.reduce((sum, i) => sum + i.price, 0);
                document.getElementById('cart-total').innerText = total.toFixed(2);
            } else {
                bar.style.display = 'none';
            }
        }

        function abrirCheckout() {
            const summary = document.getElementById('cli-summary');
            summary.innerHTML = '<strong>Platos seleccionados:</strong><br>';
            carrito.forEach((i, idx) => {
                summary.innerHTML += `
                    <div style="margin-top: 4px;">
                        ${idx + 1}. ${i.name} - $${i.price.toFixed(2)}
                        ${i.side ? `<br><small style="color:var(--gold-accent);">   └ Guarnición: ${i.side}</small>` : ''}
                        ${i.note ? `<br><small style="color:#aaa;">   └ Nota: ${i.note}</small>` : ''}
                    </div>
                `;
            });
            document.getElementById('modal-checkout').style.display = 'flex';
        }

        function cerrarModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        function enviarPedidoWhatsApp() {
            const nombre = document.getElementById('cli-name').value.trim();
            const tipo = document.getElementById('cli-type').value;
            const obs = document.getElementById('cli-obs').value.trim();

            if (!nombre) {
                alert('Por favor ingresa tu nombre para el pedido.');
                return;
            }

            let msg = `🔥 *NUEVO PEDIDO - FOGÓN* 🔥%0A%0A`;
            msg += `👤 *Cliente:* ${nombre}%0A`;
            msg += `🛵 *Servicio:* ${tipo}%0A`;
            if (obs) msg += `📝 *Nota:* ${obs}%0A`;
            msg += `%0A*DETALLE DE ORDEN:*%0A`;

            carrito.forEach((i, idx) => {
                msg += `${idx + 1}. *${i.name}* ($${i.price.toFixed(2)})%0A`;
                if (i.side) msg += `   └ Guarnición: ${i.side}%0A`;
                if (i.note) msg += `   └ Nota: ${i.note}%0A`;
            });

            const total = carrito.reduce((sum, i) => sum + i.price, 0);
            msg += `%0A💰 *TOTAL A PAGAR: $${total.toFixed(2)}*`;

            window.open(`https://wa.me/593992191545?text=${msg}`, '_blank');
        }
    </script>
    <!-- BOTÓN DE ACCESO AL MODO MODERADOR -->
<div style="text-align: center; margin: 20px 0;">
    <button onclick="accederAdmin()" style="background: #333; color: #aaa; border: 1px solid #555; padding: 6px 14px; border-radius: 20px; cursor: pointer; font-size: 0.8rem;">
        🔐 Modo Moderador
    </button>
</div>

<!-- PANEL FLOTANTE DE MODERADOR -->
<div id="panelAdmin" style="display: none; background: #181818; color: #fff; padding: 20px; border-radius: 10px; margin: 20px auto; max-width: 800px; border: 2px solid #ff5722;">
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #444; padding-bottom: 10px; margin-bottom: 15px;">
        <h3 style="margin: 0; color: #ff5722;">🛠️ Panel de Control - FOGON</h3>
        <button onclick="cerrarAdmin()" style="background: #d32f2f; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer;">Cerrar</button>
    </div>
    <div style="display: flex; gap: 10px; margin-bottom: 15px;">
        <button onclick="verPestanaAdmin('productos')" style="flex: 1; padding: 8px; background: #333; color: white; border: none; border-radius: 4px; cursor: pointer;">📦 Platos (Disponibles / Agotados)</button>
        <button onclick="verPestanaAdmin('pedidos')" style="flex: 1; padding: 8px; background: #333; color: white; border: none; border-radius: 4px; cursor: pointer;">📋 Historial de Pedidos</button>
    </div>
    <div id="adminSeccionProductos">
        <div id="listaAdminProductos" style="max-height: 350px; overflow-y: auto;"></div>
    </div>
    <div id="adminSeccionPedidos" style="display: none;">
        <div id="listaAdminPedidos" style="max-height: 350px; overflow-y: auto;"></div>
        <button onclick="limpiarPedidos()" style="margin-top: 10px; background: #444; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer;">Limpiar Historial</button>
    </div>
</div>

<script>
    // FUNCIONES DEL MODERADOR Y FACTURACIÓN
    const CLAVE_MODERADOR = "1234";

    function accederAdmin() {
        const pass = prompt("Ingrese la clave de moderador:");
        if (pass === CLAVE_MODERADOR) {
            document.getElementById('panelAdmin').style.display = 'block';
            renderizarAdmin();
        } else if (pass !== null) {
            alert("Clave incorrecta.");
        }
    }

    function cerrarAdmin() {
        document.getElementById('panelAdmin').style.display = 'none';
    }

    function verPestanaAdmin(pestana) {
        document.getElementById('adminSeccionProductos').style.display = (pestana === 'productos') ? 'block' : 'none';
        document.getElementById('adminSeccionPedidos').style.display = (pestana === 'pedidos') ? 'block' : 'none';
    }

    function toggleDisponibleAdmin(id) {
        const p = productos.find(item => item.id === id);
        if (p) {
            p.disponible = !p.disponible;
            localStorage.setItem('fogon_productos', JSON.stringify(productos));
            renderizarAdmin();
            renderizarMenu();
        }
    }

    function cambiarPrecioAdmin(id, nuevoPrecio) {
        const p = productos.find(item => item.id === id);
        if (p && !isNaN(nuevoPrecio)) {
            p.precio = parseFloat(nuevoPrecio);
            localStorage.setItem('fogon_productos', JSON.stringify(productos));
            renderizarMenu();
        }
    }

    function renderizarAdmin() {
        const contenedor = document.getElementById('listaAdminProductos');
        contenedor.innerHTML = productos.map(p => `
            <div style="display: flex; justify-content: space-between; align-items: center; background: #222; padding: 8px 12px; margin-bottom: 6px; border-radius: 5px;">
                <div>
                    <strong style="font-size: 0.9rem;">${p.nombre}</strong><br>
                    <small>$</small>
                    <input type="number" step="0.5" value="${p.precio.toFixed(2)}" onchange="cambiarPrecioAdmin(${p.id}, this.value)" style="width: 70px; background: #333; color: #fff; border: 1px solid #555; padding: 2px;">
                </div>
                <button onclick="toggleDisponibleAdmin(${p.id})" style="background: ${p.disponible ? '#2e7d32' : '#c62828'}; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-weight: bold;">
                    ${p.disponible ? '🟢 DISPONIBLE' : '🔴 AGOTADO'}
                </button>
            </div>
        `).join('');

        const historialPedidos = JSON.parse(localStorage.getItem('fogon_pedidos')) || [];
        const contenedorPedidos = document.getElementById('listaAdminPedidos');
        if (historialPedidos.length === 0) {
            contenedorPedidos.innerHTML = '<p style="color: #888;">No hay pedidos registrados todavía.</p>';
        } else {
            contenedorPedidos.innerHTML = historialPedidos.map(ped => `
                <div style="background: #222; padding: 10px; margin-bottom: 8px; border-radius: 5px; border-left: 3px solid #ff5722;">
                    <small style="color: #aaa;">${ped.fecha}</small>
                    <p style="margin: 4px 0;"><strong>Detalle:</strong> ${ped.detalle}</p>
                    ${ped.factura ? `<p style="margin: 2px 0; color: #4caf50; font-size: 0.85rem;">🧾 Factura: ${ped.factura.nombre} (RUC:${ped.factura.ruc})</p>` : '<p style="margin: 2px 0; color: #888; font-size: 0.85rem;">🧾 Sin Factura</p>'}
                    <p style="margin: 0; color: #ff5722; font-weight: bold;">Total: $${ped.total}</p>
                </div>
            `).join('');
        }
    }

    function limpiarPedidos() {
        if (confirm("¿Borrar el historial de pedidos?")) {
            localStorage.removeItem('fogon_pedidos');
            renderizarAdmin();
        }
    }
</script>
</body>
</html>
